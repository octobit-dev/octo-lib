[package]
name = "octobit-core"
version = "0.2.0"
description = "Core types of octo-lib, a deterministic pixel art engine: colors, palettes, pixel buffers and PNG"
keywords = ["pixel-art", "palette", "indexed-color", "image", "gamedev"]
categories = ["graphics", "multimedia::images", "game-development"]
readme.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
png = { version = "0.18.1", optional = true }

[dev-dependencies]
proptest = { version = "1.12", default-features = false, features = ["std"] }

[features]
default = ["png"]
# PNG read and write, indexed and RGBA.
png = ["dep:png"]
